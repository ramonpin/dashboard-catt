[project]
name = "dashboard-catt"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "catt>=0.13.3",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.98",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard"]
